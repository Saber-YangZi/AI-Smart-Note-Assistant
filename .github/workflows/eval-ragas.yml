# ============================================================
# 手动 RAG 重评测（RAGAS + DeepEval）
# 仅在需要评估当前主干检索/生成质量时手动触发，不随 push 自动跑。
# 运行在「自托管 + GPU」runner 上——秘钥/外部服务在该 runner 上已就绪。
# ============================================================
name: Eval (RAGAS / DeepEval)

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "测试数据集：ragas_testset | deepeval_matched | build 重新生成"
        required: true
        default: ragas_testset
        type: choice
        options:
          - ragas_testset
          - deepeval_matched
          - build
      run_deepeval:
        description: "构建完数据集后是否同时跑 DeepEval 门禁"
        required: false
        default: false
        type: boolean

env:
  PYTHONUNBUFFERED: "1"

jobs:
  eval:
    name: RAG 重评测
    # 仅自托管 GPU runner（需已装 uv + python3.12，且 MySQL/向量库/模型服务可达）
    runs-on: ['self-hosted', 'gpu']
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    env:
      # ── 凭据 / 外部服务全部来自 GitHub Secrets ──
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
      GLM_CHAT_MODEL: ${{ secrets.GLM_CHAT_MODEL }}
      ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ALIYUN_BASE_URL: ${{ secrets.ALIYUN_BASE_URL }}
      ALIYUN_MODEL_NAME: ${{ secrets.ALIYUN_MODEL_NAME }}
      MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
      MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      REDIS_HOST: ${{ secrets.REDIS_HOST }}
      REDIS_PORT: ${{ secrets.REDIS_PORT }}
      SECRET_KEY: ${{ secrets.JWT_SECRET }}
      ALGORITHM: HS256
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      # GPU runner 上运行：同机已有 OLLAMA/Qdrant 等
      OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
      LLM_TYPE: ${{ secrets.LLM_TYPE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: uv sync (frozen)
        run: uv sync --frozen

      # 可选：用 LLM 重新生成测试集
      - name: Build testset (LLM)
        if: ${{ inputs.dataset == 'build' }}
        run: uv run python -m tests.rag_eval.generate_testset --count 20

      - name: Run RAGAS eval (ragas_testset)
        if: ${{ inputs.dataset == 'ragas_testset' }}
        run: |
          uv run python -m tests.rag_eval.run_eval \
            --dataset tests/ragas_testset.json \
            --output eval_report_ragas.json \
            --concurrency 4

      - name: Run RAGAS eval (deepeval_matched)
        if: ${{ inputs.dataset == 'deepeval_matched' }}
        run: |
          uv run python -m tests.rag_eval.run_eval \
            --dataset tests/deepeval_eval/dataset_matched.json \
            --output eval_report_deepeval.json \
            --concurrency 4

      - name: Run DeepEval gate
        if: ${{ inputs.run_deepeval }}
        run: uv run pytest tests/deepeval_eval -m deepeval -ra

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            backend/eval_report_*.json
            backend/report_ragas*.json
          if-no-files-found: warn
          retention-days: 14