name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · lint + 快单测 + 覆盖率
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      # 纯单元测试用占位值即可（不连库）；跑不到需真实凭据的路径
      SECRET_KEY: ci-placeholder-secret
      ALGORITHM: HS256
      ENV: ci
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      MYSQL_DATABASE: chat_history_ci
      LLM_TYPE: glm
      GLM_API_KEY: ci-placeholder
      RATE_LIMIT_ENABLED: "false"
      TORCH_DEVICE: cpu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: uv sync (frozen)
        run: uv sync --frozen

      # ── 静态门禁 ──
      - name: ruff check
        run: uv run ruff check app tests
      - name: ruff format --check
        run: uv run ruff format --check app tests
      - name: isort --check-only
        run: uv run isort --check-only app tests

      # ── 快单测 + 覆盖率（跳过 GPU/DB/LLM 依赖的重评测与性能测试）──
      - name: pytest (fast unit tests + coverage)
        run: |
          uv run pytest tests/ \
            --ignore=tests/deepeval_eval --ignore=tests/rag_eval \
            -m "not deepeval and not perf" \
            --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: 前端 · typecheck + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: front-dist
          path: front/dist
          if-no-files-found: error