[project]
name = "backend"
version = "0.1.0"
description = "A FastAPI + LangChain project for LLM applications"
requires-python = ">=3.12"
authors = [
    { name = "RMA-MUN", email = "n3032747608@163.com" }
]
dependencies = [
    "python-dotenv~=1.2.2",
    "SQLAlchemy~=2.0.48",
    "langchain-core~=1.2.17",
    "aiofiles~=25.1.0",
    "langchain-text-splitters~=1.1.1",
    "fastapi~=0.123.0",
    "starlette~=0.50.0",
    "pydantic-settings~=2.13.1",
    "langchain-community~=0.4.1",
    "python-jose~=3.5.0",
    "PyYAML~=6.0.3",
    "pydantic~=2.12.5",
    "requests~=2.32.5",
    "uvicorn==0.21.1",
    "aiomysql>=0.3.2",
    "redis>=7.3.0",
    "langchain-ollama>=1.0.1",
    "langchain>=1.2.13",
    "langchain-chroma>=1.1.0",
    "python-multipart>=0.0.22",
    "dashscope>=1.25.14",
    "pypdf>=6.9.2",
    "python-magic>=0.4.27",
    "python-magic-bin>=0.4.14",
    "sentence-transformers>=5.3.0",
    "modelscope>=1.35.3",
    "accelerate>=1.13.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
    "langchain-dashscope>=0.1.8",
    "unstructured[all-docs]>=0.22.20",
    "langsmith>=0.7.22",
    "langgraph-cli[inmem]>=0.1.54",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.25.0",
    "pillow>=10.0.0",
    "imagehash>=4.3.0",
    "docx2txt>=0.9",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

# 开发依赖
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.0.0",
    "black>=24.0.0",
    "isort>=5.12.0",
    "ruff>=0.3.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "deepeval==3.9.9",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

# ── 代码风格 / 静态检查 ──────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# 常见噪声项先排除，避免让旧代码大面积红（可按需逐步放开）
ignore = [
    "E501",          # 行长度（已开 120，仍有超长可容忍）
    "B008",          # FastAPI 依赖注入默认值（Depends(...)），后端大量使用
    "UP007",         # 旧代码使用 Optional[...] 约定，统一后此项可能报
]

[tool.ruff.format]
preview = true

# ── Pytest ─────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "deepeval: RAG 质量门禁测试（需 DashScope API + 向量库 + MySQL/Redis，默认跳过）",
    "perf: 性能测试（需后端 :8000 + 模型服务，默认跳过）",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/models/*", "*/scripts/*"]

[tool.coverage.report]
fail_under = 40
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "def __repr__",
]
