# ============================================================
# 生产编排（CD 用）。只包含 Web 层：backend(FastAPI) + front(nginx)。
# MySQL/Redis/向量库/LLM/OCR 均不打包，运行期经 environment 指向外部服务。
# 用法（在目标主机，已登录 GHCR）：
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# 变量可在目标机 export，或复制 backend/.env.example 为 .env.prod 后引用。
# ============================================================
name: ai-note-prod

x-backend-env: &backend-env
  # ── 认证/安全 ──
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  ALGORITHM: HS256
  ENV: production
  # ── MySQL ──
  MYSQL_HOST: ${MYSQL_HOST:-mysql}
  MYSQL_PORT: ${MYSQL_PORT:-3306}
  MYSQL_USER: ${MYSQL_USER:-root}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-chat_history}
  # ── 用户服务 Django ──
  DJANGO_API_URL: ${DJANGO_API_URL:-http://django:8001}
  # ── 大模型（LLM_TYPE: glm | aliyun | ollama | vllm）──
  LLM_TYPE: ${LLM_TYPE:-glm}
  GLM_API_KEY: ${GLM_API_KEY:-}
  GLM_BASE_URL: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/}
  GLM_CHAT_MODEL: ${GLM_CHAT_MODEL:-glm-4-air}
  ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
  ALIYUN_BASE_URL: ${ALIYUN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  ALIYUN_MODEL_NAME: ${ALIYUN_MODEL_NAME:-qwen-plus}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  # ── 向量库/模型路径 ──
  VECTOR_STORE_TYPE: ${VECTOR_STORE_TYPE:-qdrant}
  QDRANT_PATH: /app/qdrant
  # ── 限流默认关 ──
  RATE_LIMIT_ENABLED: "false"

services:
  backend:
    image: ghcr.io/saber-yangzi/ai-smart-note-assistant:backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment: *backend-env
    volumes:
      - qdrant-data:/app/qdrant      # 本地向量库持久化
      - storage-data:/app/storage    # 图片/附件抽取落盘

  front:
    image: ghcr.io/saber-yangzi/ai-smart-note-assistant:front
    build:
      context: .
      dockerfile: front/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  # ── 可选：用户服务 Django（若已独立部署可注释掉）──
  # django:
  #   image: your-django-image:latest
  #   restart: unless-stopped
  #   ports:
  #     - "8001:8001"

volumes:
  qdrant-data:
  storage-data: