# ============================================================
# 容器内 nginx：伺服前端 dist + 反代后端(backend:8000) / 用户服务(django:8001)
# 挂载位置：/etc/nginx/conf.d/default.conf（front 镜像里已 COPY）
# 与 deploy/nginx.conf（宿主版）逻辑同源，仅把 127.0.0.1 换成容器服务名
# ============================================================
server {
    listen 80;
    server_name _;

    # 大文件上传（知识库允许文件夹 200MB，Nginx 默认 1MB 会 413）
    client_max_body_size 220m;

    # Docker 内置 DNS（compose 服务名解析；django 缺席时 front 仍可启动）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── 后端 FastAPI (backend 服务, :8000) ──
    upstream fastapi_backend { server backend:8000; }
    # 用户服务 Django（compose 未启用 django 时，/user /file 返回 502，不影响启动）

    # ── 前端静态产物（Vue Router history 回退）──
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 知识库：上传走 SSE 进度，必须关缓冲 + 长超时 ──
    location /knowledge/ {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 聊天：回答是 SSE 打字机 ──
    location /chat/ {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # RAG_TIMEOUT_GENERATE 上限 120s，留余量
        proxy_read_timeout 600s;
    }

    # ── 用户服务 Django：登录/注册（变量代理 + runtime resolver，缺服务→502 不崩）──
    location /user/ {
        set $django_upstream django:8001;
        proxy_pass http://$django_upstream;
        proxy_set_header Host django:8001;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # ── 用户服务 Django：文件 ──
    location /file/ {
        set $django_upstream django:8001;
        proxy_pass http://$django_upstream;
        proxy_set_header Host django:8001;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 220m;
        proxy_read_timeout 600s;
    }
}